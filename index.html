<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>What's Your Navratri Colour? · Jazbaa X Ashoka Data Society</title>
  <meta name="description" content="8 questions. Zero overthinking. One outfit colour. Find your Navratri colour.">
  <meta name="theme-color" content="#1C1850" id="themeColor">
  <meta property="og:title" content="What's Your Navratri Colour?">
  <meta property="og:description" content="8 questions. Zero overthinking. One outfit colour.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23F5A623'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23E2442B'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-screen="landing">
  <div class="shell" id="shell">
    <noscript><p class="noscript">This quiz needs JavaScript. Please enable it and reload.</p></noscript>

    <!-- 1. Landing -->
    <section id="landing" class="screen landing" aria-labelledby="landingTitle">
      <div class="landing-top">
        <div class="lehariya" aria-hidden="true"></div>
        <div class="mirror-cluster" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <h1 id="landingTitle" class="display"></h1>
      <p class="hook" id="hook"></p>
      <button type="button" class="btn btn-primary btn-big" id="startBtn">Start</button>
      <p class="credit" id="credit"></p>
      <div class="landing-art" id="landingArt" aria-hidden="true"></div>
    </section>

    <!-- 2. Questions -->
    <section id="quiz" class="screen quiz" hidden aria-label="Quiz">
      <div class="quiz-head">
        <button type="button" class="back" id="backBtn"><span aria-hidden="true">←</span> Back</button>
        <ol class="progress" id="progress" aria-label="Progress"></ol>
      </div>
      <p class="qcount" id="qcount"></p>
      <h2 class="qtext display" id="qtext" tabindex="-1"></h2>
      <div class="answers" id="answers"></div>
    </section>

    <!-- 3. Reveal -->
    <section id="reveal" class="screen reveal" hidden aria-live="polite">
      <div class="ring-wrap" aria-hidden="true"><div class="ring" id="ring"></div></div>
      <p class="reveal-calc" id="revealCalc">Calculating your vibe…</p>
      <p class="reveal-line" id="revealLine" hidden>Your Navratri colour is <strong id="revealName"></strong></p>
    </section>

    <!-- 4. Result -->
    <section id="result" class="screen result" hidden aria-labelledby="resName">
      <div class="result-hero">
        <p class="eyebrow">Your Navratri colour is</p>
        <h2 class="result-name display" id="resName" tabindex="-1"></h2>
        <div class="lehariya" aria-hidden="true"></div>
        <p class="result-headline display" id="resHeadline"></p>
        <p class="result-blurb" id="resBlurb"></p>
      </div>

      <div class="panel panel-outfits">
        <h3 class="panel-title">What to wear</h3>
        <div class="outfits" id="outfits"></div>
      </div>

      <div class="panel panel-chart">
        <h3 class="panel-title">Where you landed</h3>
        <div id="chart" class="chart"></div>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-primary" id="shareBtn">Share</button>
        <button type="button" class="btn btn-ghost" id="againBtn">Take it again</button>
      </div>
      <p class="credit result-credit" id="credit2"></p>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="quiz-data.js"></script>
  <script src="scoring.js"></script>
  <script src="app.js"></script>
</body>
</html>
